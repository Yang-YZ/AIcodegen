name: Daily AI App Ideas

on:
  schedule:
    - cron: "0 14 * * *" # runs every day at 14:00 UTC
  workflow_dispatch: # allow manual run

permissions:
  contents: write

jobs:
  ai_ideas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate AI application ideas
        id: ai_ideas
        run: |
          output=$(node scripts/ai_ideas.mjs)
          echo "$output"
          new_ideas=$(echo "$output" | awk '/::group::new_ideas/{flag=1;next}/::endgroup/{flag=0}flag')
          echo "new_ideas<<EOF" >> $GITHUB_OUTPUT
          echo "$new_ideas" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Send email with ideas
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🤖 Daily AI App Ideas"
          to: ${{ secrets.MAIL_TO }}
          from: "AI Idea Bot <${{ secrets.EMAIL_USERNAME }}>"
          secure: true
          body: |
            Hi!

            Here are today's AI application ideas:

            ${{ steps.ai_ideas.outputs.new_ideas }}

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_IDEAS.md data/idea_titles.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: append AI ideas and update titles"
            git push
          fi
