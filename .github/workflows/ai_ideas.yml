name: Daily AI App Ideas

on:
  schedule:
    - cron: "0 14 * * *" # runs every day at 14:00 UTC
  workflow_dispatch: # allow manual run

jobs:
  ai_ideas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate AI application ideas
        run: node scripts/ai_ideas.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Read AI_IDEAS.md
        id: read_ideas
        run: |
          content=$(cat AI_IDEAS.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$content" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send email with ideas
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🤖 Daily AI App Ideas"
          to: ${{ secrets.MAIL_TO }}
          from: "AI Idea Bot <${{ secrets.EMAIL_USERNAME }}>"
          secure: true
          body: |
            Hi!

            Here are today's AI application ideas:

            ${{ steps.read_ideas.outputs.content }}
