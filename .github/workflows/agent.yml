name: AI Agent

on:
  issues:
    types: [labeled]

jobs:
  agent:
    if: github.event.label.name == 'ai-task'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openai pytest

      - name: Run agent (generate code)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python .github/scripts/agent.py

      - name: Run tests before PR
        run: pytest

      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ai/${{ github.run_id }}
          title: "AI: ${{ github.event.issue.title }}"
          body: |
            Auto-generated by AI agent.

            Source issue: #${{ github.event.issue.number }}
