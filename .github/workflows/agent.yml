name: AI Agent

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:  # allows manual run for testing

jobs:
  agent:
    if: github.event.label.name == 'ai-task' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      # Step 0: checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # Step 1: setup python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 2: install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openai pytest

      # Step 3: debug
      - name: Debug event
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Issue title: ${{ github.event.issue.title }}"
          echo "Label: ${{ github.event.label.name }}"

      # Step 4: run agent (generate code)
      - name: Run agent (generate code)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          PYTHONPATH: ${{ github.workspace }}   # ← important for imports
        run: python .github/scripts/agent.py

      - name: Show main.py
        run: cat app/main.py

      - name: Show git status
        run: |
          git status
          git diff

      # Step 5: run tests before PR
      - name: Run tests before PR
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt
          pytest

      # Step 6: create pull request if tests pass
      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ai/${{ github.run_id }}
          title: "AI: ${{ github.event.issue.title }}"
          body: |
            Auto-generated by AI agent.

            Source issue: #${{ github.event.issue.number }}
