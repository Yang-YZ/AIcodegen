name: AI Issue Agent

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:

jobs:
  implement-from-issue:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (
        github.event.label.name == 'ai-task' ||
        contains(github.event.issue.labels.*.name, 'ai-task')
      ))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openai pytest

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create working branch
        run: git checkout -b ai/issue-${{ github.event.issue.number || github.run_id }}

      - name: Generate code with coding agent
        env:
          AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER || 'codex' }}
          AGENT_BASE_URL: ${{ vars.AGENT_BASE_URL }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'gpt-5-mini' }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python .github/scripts/agent.py

      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests

      - name: Integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ -d tests/integration ]; then
            pytest tests/integration
          else
            echo "No integration tests found at tests/integration; skipping."
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: implement issue #${{ github.event.issue.number }} via AI agent"
          branch: ai/issue-${{ github.event.issue.number || github.run_id }}
          title: "AI: implement #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"
          body: |
            Automated implementation generated from issue #${{ github.event.issue.number }}.

            ## Pipeline summary
            - Triggered from GitHub Issue event.
            - Code generated by configured coding agent (`codex` or OpenAI-compatible proxy).
            - Unit tests and integration tests executed in CI before PR creation.

            This PR was created automatically by `.github/workflows/agent.yml`.
