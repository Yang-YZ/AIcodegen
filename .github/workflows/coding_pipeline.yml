name: Coding Agent Pipeline

on:
  workflow_dispatch: # Manual trigger
    inputs:
      dry_run:
        description: 'Dry run (generate plan only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    - cron: "0 12 * * 1" # Run every Monday at noon UTC

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  execute_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Execute Coding Pipeline
        id: pipeline
        run: |
          echo "Starting coding pipeline..."
          node scripts/coding_pipeline.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}

      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: implement generated project from coding pipeline"
          title: "🤖 Auto-generated Implementation"
          body: |
            ## Auto-generated Implementation
            
            This PR contains code generated by the coding agent pipeline.
            
            ### What's included
            - Generated project structure
            - Implementation code
            - Documentation
            
            ### Review checklist
            - [ ] Code quality and structure
            - [ ] Documentation completeness
            - [ ] Test coverage (if applicable)
            - [ ] Security considerations
            
            ---
            *This PR was automatically created by the coding pipeline workflow*
          branch: feature/auto-implementation-${{ github.run_number }}
          delete-branch: true
          labels: |
            automated
            implementation
